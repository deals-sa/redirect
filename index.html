<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        .bg-glow--1 {
            top: -200px;
            left: -100px;
            background: #6366f1;
        }

        .bg-glow--2 {
            bottom: -200px;
            right: -100px;
            background: #8b5cf6;
            animation-delay: -3s;
        }

        .container {
            text-align: center;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        .spinner-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 32px;
        }

        .spinner-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .spinner-ring--outer {
            border-top-color: #818cf8;
            border-right-color: #818cf8;
            animation: spin 1.2s linear infinite;
        }

        .spinner-ring--middle {
            inset: 10px;
            border-bottom-color: #a78bfa;
            border-left-color: #a78bfa;
            animation: spin 1.8s linear infinite reverse;
        }

        .spinner-ring--inner {
            inset: 20px;
            border-top-color: #c4b5fd;
            animation: spin 0.9s linear infinite;
        }

        .spinner-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin: -6px 0 0 -6px;
            background: #818cf8;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .progress-track {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #818cf8, #a78bfa, #c084fc);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .timer {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
            font-variant-numeric: tabular-nums;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-in forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0.98) translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <div class="container" id="container">
        <div class="spinner-wrapper">
            <div class="spinner-ring spinner-ring--outer"></div>
            <div class="spinner-ring spinner-ring--middle"></div>
            <div class="spinner-ring spinner-ring--inner"></div>
            <div class="spinner-dot"></div>
        </div>
        <div class="title">A processar...</div>
        <div class="subtitle">Serás redirecionado em breve</div>
        <div class="progress-track">
            <div class="progress-bar" id="progress"></div>
        </div>
        <div class="timer" id="timer">3s</div>
    </div>

    <script>
        const REDIRECT_URL = "https://deals-sa.github.io/machineskit/";
        const DURATION = 3000;

        const progress = document.getElementById("progress");
        const timer = document.getElementById("timer");
        const container = document.getElementById("container");
        const start = Date.now();

        function update() {
            const elapsed = Date.now() - start;
            const pct = Math.min((elapsed / DURATION) * 100, 100);
            const remaining = Math.max(Math.ceil((DURATION - elapsed) / 1000), 0);

            progress.style.width = pct + "%";
            timer.textContent = remaining + "s";

            if (elapsed >= DURATION) {
                container.classList.add("fade-out");
                setTimeout(function () {
                    window.location.href = REDIRECT_URL;
                }, 500);
                return;
            }

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
